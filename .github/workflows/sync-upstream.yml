name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Rebase our fork-only commits onto upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/andyaiken/forgesteel.git
          git fetch upstream
          git checkout main

          if [ "$(git rev-parse main)" = "$(git rev-parse upstream/main)" ]; then
            echo "Already up to date with upstream."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rebase upstream/main; then
            git push --force-with-lease origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rebase conflict - needs manual resolution:"
            git diff --name-only --diff-filter=U
            git rebase --abort
            exit 1
          fi

      - name: Trigger image build
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-and-push.yml --ref main --repo RickyTan01/forgesteel
